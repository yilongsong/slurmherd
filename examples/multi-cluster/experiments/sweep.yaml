# The same study, split across machines by where the GPUs are.
group: sweep

defaults:
  workdir: "{{ remote_dir }}/code"
  command: >
    python train.py --seed {{ seed }} --size {{ size }}
    --out {{ run_dir }}/out
  progress:
    kind: log_regex
    pattern: 'step[ =:]+(\d+)'
    target: 100000
    unit: steps
  completion: {when: progress_target}
  resume:
    when_exists: "{{ run_dir }}/out/last.ckpt"
    command: "python train.py --resume {{ run_dir }}/out/last.ckpt --out {{ run_dir }}/out"

experiments:
  # Small models on Delta's A100 nodes.
  - name: small-s{{ seed }}
    cluster: delta
    matrix: {seed: [0, 1, 2]}
    params: {size: small}
    resources: {gpus: 1, cpus_per_task: 16, mem: 64G, time: "24:00:00"}

  # Large models on DeltaAI's GH200 nodes -- remember: arm64, so a separate env.
  - name: large-s{{ seed }}
    cluster: deltaai
    matrix: {seed: [0, 1, 2]}
    params: {size: large}
    env:
      conda: /work/nvme/{{ vars.project_id }}/{{ user }}/envs/train-arm64
    resources: {gpus: 1, cpus_per_task: 32, mem: 128G, time: "24:00:00"}

  # A CPU-only baseline back on MSI.
  - name: baseline
    cluster: msi
    params: {seed: 0, size: small}
    resources: {partition: msismall, cpus_per_task: 8, mem: 32G, time: "12:00:00"}
